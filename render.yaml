services:
  - type: web
    name: simmerhus
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: true
    domains:
      - www.simmerhus.nl
      - simmerhus.nl
    headers:
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
